<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compra e doação — catálogo de itens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#a98f63;
    --board-dark:#8f7650;
    --paper:#f1e8d4;
    --paper-shadow:#d8c9a4;
    --ink:#2b241c;
    --ink-soft:#5a5040;
    --string:#a9855b;
    --sale:#b1372c;
    --donate:#3f5d3a;
    --pin:#c9401f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.05), transparent 40%),
      radial-gradient(circle at 80% 60%, rgba(0,0,0,0.08), transparent 45%),
      repeating-linear-gradient(0deg, var(--board) 0px, var(--board) 2px, var(--board-dark) 2px, var(--board-dark) 3px),
      var(--board);
    min-height:100vh;
  }
  header{
    padding:44px 16px 28px;
    text-align:center;
  }
  .stamp{
    display:inline-block;
    border:3px solid #fff8ea;
    color:#fff8ea;
    font-family:'Special Elite', monospace;
    font-size:clamp(22px, 6vw, 46px);
    letter-spacing:2px;
    padding:12px 22px;
    transform:rotate(-2deg);
    text-transform:uppercase;
    position:relative;
    max-width:92vw;
    text-shadow:0 1px 3px rgba(0,0,0,0.5);
  }
  .stamp::before, .stamp::after{
    content:"";
    position:absolute;
    width:8px;height:8px;
    border:2px solid #fff8ea;
    border-radius:50%;
    top:-5px;
  }
  .stamp::before{left:-5px;}
  .stamp::after{right:-5px;}
  header p{
    margin-top:16px;
    font-family:'Space Mono', monospace;
    color:#fff8ea;
    font-size:13px;
    letter-spacing:1px;
    text-shadow:0 1px 2px rgba(0,0,0,0.45);
  }
  .search-wrap{
    max-width:520px;
    margin:0 auto 24px;
    padding:0 16px;
  }
  .search-wrap input{
    width:100%;
    font-family:'Space Mono', monospace;
    font-size:14px;
    padding:12px 14px;
    border:1.5px dashed var(--ink-soft);
    background:var(--paper);
    color:var(--ink);
    outline:none;
  }
  .search-wrap input::placeholder{color:var(--ink-soft); opacity:0.7;}
  .search-wrap input:focus{border-style:solid; border-color:var(--ink);}
  .filters{
    max-width:920px;
    margin:0 auto 8px;
    padding:0 16px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
  }
  .filter-btn{
    font-family:'Space Mono', monospace;
    font-size:12px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    background:var(--paper);
    color:var(--ink);
    border:1px dashed var(--ink-soft);
    padding:9px 13px;
    min-height:38px;
    cursor:pointer;
    box-shadow:2px 2px 0 rgba(0,0,0,0.2);
    transition:transform 0.15s ease;
  }
  .filter-btn:hover{transform:translateY(-2px);}
  .filter-btn.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--paper);
  }
  .divider{
    max-width:920px;
    margin:20px auto;
    border:none;
    border-top:2px dashed rgba(241,232,212,0.4);
  }
  .count{
    text-align:center;
    font-family:'Space Mono', monospace;
    font-size:14px;
    color:var(--paper);
    opacity:0.75;
    margin-bottom:8px;
  }
  #grid{
    max-width:1040px;
    margin:0 auto;
    padding:16px 20px 40px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:44px 24px;
    align-items:stretch;
  }
  .tag{
    position:relative;
    background:var(--paper);
    box-shadow:3px 4px 0 rgba(0,0,0,0.25);
    padding:18px 16px 16px;
    display:flex;
    flex-direction:column;
  }
  .pin{
    position:absolute;
    top:-11px;
    left:50%;
    transform:translateX(-50%);
    width:16px;height:16px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ff8a5c, var(--pin));
    box-shadow:0 2px 3px rgba(0,0,0,0.4);
    z-index:2;
  }
  .hole{
    position:absolute;
    top:10px; left:10px;
    width:12px;height:12px;
    border-radius:50%;
    background:var(--board);
    box-shadow:inset 0 0 0 1.5px rgba(0,0,0,0.3);
  }
  .type-stamp{
    position:absolute;
    top:12px; right:10px;
    font-family:'Special Elite', monospace;
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    padding:3px 8px;
    border:2px solid;
    transform:rotate(6deg);
    border-radius:3px;
    z-index:2;
  }
  .type-stamp.venda{color:var(--sale); border-color:var(--sale);}
  .type-stamp.doacao{color:var(--donate); border-color:var(--donate);}
  .photo{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    background:repeating-linear-gradient(135deg, var(--paper-shadow), var(--paper-shadow) 8px, var(--paper) 8px, var(--paper) 16px);
    border:1.5px dashed var(--ink-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:14px;
    overflow:hidden;
    touch-action:pan-y;
  }
  .photo img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;}
  .photo svg{width:46%;opacity:0.55;}
  .photo-nav{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:26px;height:26px;
    border-radius:50%;
    border:none;
    background:rgba(43,36,28,0.55);
    color:var(--paper);
    font-size:16px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:0;
    z-index:3;
  }
  .photo-nav:hover{background:rgba(43,36,28,0.8);}
  .photo-nav.prev{left:6px;}
  .photo-nav.next{right:6px;}
  .photo-dots{
    position:absolute;
    bottom:6px;
    left:0; right:0;
    display:flex;
    justify-content:center;
    gap:5px;
    z-index:3;
  }
  .photo-dots .dot{
    width:6px;height:6px;
    border-radius:50%;
    background:rgba(241,232,212,0.55);
  }
  .photo-dots .dot.active{
    background:var(--paper);
  }
  .tag h3{
    font-family:'Special Elite', monospace;
    font-size:16px;
    margin:14px 0 4px;
    line-height:1.25;
  }
  .tag .cat{
    font-family:'Space Mono', monospace;
    font-size:10px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:1px;
    margin-bottom:8px;
  }
  .desc-wrap{
    flex:1 1 auto;
    margin-bottom:12px;
  }
  .tag .desc{
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.4;
    min-height:18px;
  }
  .tag .desc-text{
    max-height:91px;
    overflow:hidden;
  }
  .tag .desc-text.expanded{
    max-height:none;
  }
  .tag .desc ul{
    margin:0;
    padding-left:16px;
  }
  .tag .desc li{
    margin-bottom:2px;
  }
  .desc-toggle{
    background:none;
    border:none;
    padding:4px 0 0;
    font-family:'Space Mono', monospace;
    font-size:12px;
    color:var(--ink);
    text-decoration:underline;
    cursor:pointer;
  }
  .price{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:15px;
    margin-bottom:12px;
  }
  .price.doacao{color:var(--donate);}
  .price.venda{color:var(--sale);}
  .contact-btn{
    text-align:center;
    text-decoration:none;
    font-family:'Space Mono', monospace;
    font-size:13px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    background:var(--ink);
    color:var(--paper);
    padding:12px;
    min-height:44px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:none;
    cursor:pointer;
  }
  .contact-btn:hover{background:#000;}
  .empty{
    grid-column:1/-1;
    text-align:center;
    color:var(--paper);
    font-family:'Space Mono', monospace;
    padding:60px 0;
    opacity:0.8;
  }
  .pagination{
    max-width:920px;
    margin:0 auto 60px;
    padding:0 16px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    align-items:center;
  }
  .page-btn{
    font-family:'Space Mono', monospace;
    font-size:12px;
    background:var(--paper);
    color:var(--ink);
    border:1px dashed var(--ink-soft);
    padding:8px 12px;
    min-width:38px;
    min-height:38px;
    cursor:pointer;
  }
  .page-btn.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--paper);
  }
  .page-btn:disabled{
    opacity:0.35;
    cursor:default;
  }
  footer{
    text-align:center;
    padding:20px;
    font-family:'Space Mono', monospace;
    font-size:14px;
    color:#fff8ea;
    opacity:0.9;
    text-shadow:0 1px 2px rgba(0,0,0,0.4);
  }
  .lightbox{
    position:fixed;
    inset:0;
    background:rgba(20,16,10,0.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:24px;
    cursor:zoom-out;
  }
  .lightbox.open{display:flex;}
  .lightbox-card{
    position:relative;
    max-width:min(900px, 92vw);
    max-height:92vh;
    background:var(--paper);
    padding:10px;
    box-shadow:0 10px 34px rgba(0,0,0,0.45);
    cursor:default;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .lightbox img{
    display:block;
    max-width:100%;
    max-height:calc(92vh - 20px);
    object-fit:contain;
  }
  .lightbox-close{
    position:absolute;
    top:-14px;
    right:-14px;
    width:32px;height:32px;
    border-radius:50%;
    border:none;
    background:var(--ink);
    color:var(--paper);
    font-size:16px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:2;
  }
  .lightbox-nav{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:36px;height:36px;
    border-radius:50%;
    border:none;
    background:rgba(43,36,28,0.6);
    color:var(--paper);
    font-size:20px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:0;
    z-index:2;
  }
  .lightbox-nav:hover{background:rgba(43,36,28,0.85);}
  .lightbox-nav.prev{left:8px;}
  .lightbox-nav.next{right:8px;}
  .lightbox-dots{
    position:absolute;
    bottom:6px;
    left:0; right:0;
    display:flex;
    justify-content:center;
    gap:5px;
  }
  .lightbox-dots .dot{
    width:6px;height:6px;
    border-radius:50%;
    background:rgba(43,36,28,0.3);
  }
  .lightbox-dots .dot.active{
    background:var(--ink);
  }
  @media (max-width:600px){
    #grid{
      grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
      gap:34px 14px;
      padding:12px 12px 32px;
    }
    .tag{padding:14px 12px 12px;}
    .tag h3{font-size:14px;}
    .filter-btn{font-size:11px; padding:8px 10px;}
  }
  @media (prefers-reduced-motion: reduce){
    .filter-btn{transition:none;}
  }
</style>
</head>
<body>
<header>
  <div class="stamp">venda e doação</div>
  <p>O valor de qualquer item é negociável</p>
</header>
<div class="search-wrap">
  <input type="text" id="searchInput" placeholder="Buscar item (ex: roupa, mesa, panela)...">
</div>
<div class="filters" id="typeFilters"></div>
<div class="filters" id="catFilters"></div>
<hr class="divider">
<div class="count" id="countLabel"></div>
<div id="grid"></div>
<div class="pagination" id="pagination"></div>
<footer>catálogo pessoal · chame no WhatsApp</footer>

<div class="lightbox" id="lightbox">
  <div class="lightbox-card" id="lightboxCard">
    <button type="button" class="lightbox-close" id="lightboxClose">✕</button>
    <img id="lightboxImg" src="" alt="">
  </div>
</div>

<script src="dados.js"></script>
<script>
let activeType = "todos";
let activeCat = "todos";
let searchTerm = "";
let currentPage = 1;

function normalize(str){
  return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

function buildFilters(){
  const typeWrap = document.getElementById('typeFilters');
  const typeOptions = [["todos","Todos"],["venda","Venda"],["doacao","Doação"]];
  typeOptions.forEach(([val,label])=>{
    const b = document.createElement('button');
    b.className = 'filter-btn' + (val==='todos' ? ' active' : '');
    b.textContent = label;
    b.onclick = ()=>{ activeType = val; currentPage=1; refreshActive(typeWrap,b); render(); };
    typeWrap.appendChild(b);
  });
  const catWrap = document.getElementById('catFilters');
  const allBtn = document.createElement('button');
  allBtn.className = 'filter-btn active';
  allBtn.textContent = 'Todas categorias';
  allBtn.onclick = ()=>{ activeCat='todos'; currentPage=1; refreshActive(catWrap, allBtn); render(); };
  catWrap.appendChild(allBtn);
  Object.entries(CATEGORIES).forEach(([key,label])=>{
    const b = document.createElement('button');
    b.className = 'filter-btn';
    b.textContent = label;
    b.onclick = ()=>{ activeCat = key; currentPage=1; refreshActive(catWrap,b); render(); };
    catWrap.appendChild(b);
  });
}

function refreshActive(wrap, btn){
  [...wrap.children].forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
}

document.getElementById('searchInput').addEventListener('input', (e)=>{
  searchTerm = normalize(e.target.value.trim());
  currentPage = 1;
  render();
});

function getFiltered(){
  return ITEMS.filter(i=>{
    if(i.ativo === false) return false;
    const matchesType = activeType === 'todos' || i.type === activeType;
    const matchesCat = activeCat === 'todos' || i.category === activeCat;
    const haystack = normalize(i.name);
    const matchesSearch = searchTerm === '' || haystack.includes(searchTerm);
    return matchesType && matchesCat && matchesSearch;
  });
}

/* Lightbox: abre a foto clicada em tamanho maior, permitindo navegar entre as fotos do mesmo item */
const lightbox = document.getElementById('lightbox');
const lightboxCard = document.getElementById('lightboxCard');
const lightboxImg = document.getElementById('lightboxImg');
let lightboxPhotos = [];
let lightboxIdx = 0;
let lightboxAlt = '';

function paintLightbox(){
  lightboxImg.src = lightboxPhotos[lightboxIdx];
  lightboxImg.alt = lightboxAlt;
  lightboxCard.querySelectorAll('.lightbox-nav, .lightbox-dots').forEach(el => el.remove());
  if(lightboxPhotos.length > 1){
    const prev = document.createElement('button');
    prev.type = 'button';
    prev.className = 'lightbox-nav prev';
    prev.innerHTML = '‹';
    prev.onclick = (e)=>{ e.stopPropagation(); lightboxIdx = (lightboxIdx - 1 + lightboxPhotos.length) % lightboxPhotos.length; paintLightbox(); };
    const next = document.createElement('button');
    next.type = 'button';
    next.className = 'lightbox-nav next';
    next.innerHTML = '›';
    next.onclick = (e)=>{ e.stopPropagation(); lightboxIdx = (lightboxIdx + 1) % lightboxPhotos.length; paintLightbox(); };
    const dots = document.createElement('div');
    dots.className = 'lightbox-dots';
    lightboxPhotos.forEach((_, i)=>{
      const dot = document.createElement('span');
      dot.className = 'dot' + (i === lightboxIdx ? ' active' : '');
      dots.appendChild(dot);
    });
    lightboxCard.appendChild(prev);
    lightboxCard.appendChild(next);
    lightboxCard.appendChild(dots);
  }
}

function openLightbox(photos, startIdx, alt){
  lightboxPhotos = photos;
  lightboxIdx = startIdx;
  lightboxAlt = alt;
  paintLightbox();
  lightbox.classList.add('open');
}
function closeLightbox(){
  lightbox.classList.remove('open');
  lightboxImg.src = '';
}
document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e)=>{
  if(e.target === lightbox) closeLightbox();
});
document.addEventListener('keydown', (e)=>{
  if(!lightbox.classList.contains('open')) return;
  if(e.key === 'Escape') closeLightbox();
  if(e.key === 'ArrowLeft' && lightboxPhotos.length > 1){ lightboxIdx = (lightboxIdx - 1 + lightboxPhotos.length) % lightboxPhotos.length; paintLightbox(); }
  if(e.key === 'ArrowRight' && lightboxPhotos.length > 1){ lightboxIdx = (lightboxIdx + 1) % lightboxPhotos.length; paintLightbox(); }
});

/* Monta o bloco de foto (ou carrossel, se houver mais de uma) de um item */
function buildPhotoBlock(item){
  const photos = item.photos || [];
  const wrap = document.createElement('div');
  wrap.className = 'photo';
  let idx = 0;
  function paint(){
    wrap.innerHTML = '';
    if(photos.length === 0){
      wrap.innerHTML = ICONS[item.category] || ICONS.outros;
      return;
    }
    const img = document.createElement('img');
    img.src = photos[idx];
    img.alt = item.name;
    img.onclick = (e)=>{ e.stopPropagation(); openLightbox(photos, idx, item.name); };
    wrap.appendChild(img);
    if(photos.length > 1){
      const prev = document.createElement('button');
      prev.type = 'button';
      prev.className = 'photo-nav prev';
      prev.innerHTML = '‹';
      prev.onclick = (e)=>{ e.stopPropagation(); idx = (idx - 1 + photos.length) % photos.length; paint(); };
      const next = document.createElement('button');
      next.type = 'button';
      next.className = 'photo-nav next';
      next.innerHTML = '›';
      next.onclick = (e)=>{ e.stopPropagation(); idx = (idx + 1) % photos.length; paint(); };
      const dots = document.createElement('div');
      dots.className = 'photo-dots';
      photos.forEach((_, i)=>{
        const dot = document.createElement('span');
        dot.className = 'dot' + (i === idx ? ' active' : '');
        dots.appendChild(dot);
      });
      wrap.appendChild(prev);
      wrap.appendChild(next);
      wrap.appendChild(dots);
    }
  }
  let touchStartX = null;
  wrap.addEventListener('touchstart', (e)=>{ touchStartX = e.touches[0].clientX; }, {passive:true});
  wrap.addEventListener('touchend', (e)=>{
    if(touchStartX === null || photos.length < 2) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) > 40){
      idx = dx > 0 ? (idx - 1 + photos.length) % photos.length : (idx + 1) % photos.length;
      paint();
    }
    touchStartX = null;
  }, {passive:true});
  paint();
  return wrap;
}

/* Monta o HTML da descrição: lista com marcadores se for array, texto simples se for string */
function buildDescHTML(desc){
  if(Array.isArray(desc)){
    return `<ul>${desc.map(d => `<li>${d}</li>`).join('')}</ul>`;
  }
  return desc || '';
}

/* Monta o bloco de descrição com "ver mais / ver menos" quando o texto passa de ~5 linhas */
function buildDescBlock(item){
  const wrap = document.createElement('div');
  wrap.className = 'desc-wrap';

  const descDiv = document.createElement('div');
  descDiv.className = 'desc';

  const textDiv = document.createElement('div');
  textDiv.className = 'desc-text';
  textDiv.innerHTML = buildDescHTML(item.desc);
  descDiv.appendChild(textDiv);
  wrap.appendChild(descDiv);

  if(item.desc){
    const toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = 'desc-toggle';
    toggle.textContent = 'ver mais';
    toggle.style.display = 'none';
    wrap.appendChild(toggle);

    let expanded = false;
    toggle.onclick = ()=>{
      expanded = !expanded;
      textDiv.classList.toggle('expanded', expanded);
      toggle.textContent = expanded ? 'ver menos' : 'ver mais';
    };

    // Só mostra o botão se o texto realmente ultrapassar o limite de linhas
    requestAnimationFrame(()=>{
      if(textDiv.scrollHeight > textDiv.clientHeight + 1){
        toggle.style.display = 'inline-block';
      }
    });
  }

  return wrap;
}

function render(){
  const filtered = getFiltered();
  const grid = document.getElementById('grid');
  const countLabel = document.getElementById('countLabel');
  grid.innerHTML = '';
  countLabel.textContent = filtered.length === 0
    ? ''
    : `${filtered.length} ${filtered.length === 1 ? 'item encontrado' : 'itens encontrados'}`;
  if(filtered.length === 0){
    grid.innerHTML = '<div class="empty">Nenhum item encontrado com essa busca/filtro.</div>';
    document.getElementById('pagination').innerHTML = '';
    return;
  }
  const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE);
  if(currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage - 1) * ITEMS_PER_PAGE;
  const pageItems = filtered.slice(start, start + ITEMS_PER_PAGE);
  pageItems.forEach((item) => {
    const card = document.createElement('div');
    card.className = 'tag';
    const msg = encodeURIComponent(`Oi! Vi seu anúncio e tenho interesse em: ${item.name}`);
    const waLink = `https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`;
    card.innerHTML = `
      <div class="pin"></div>
      <div class="hole"></div>
      <div class="type-stamp ${item.type}">${item.type === 'venda' ? 'Venda' : 'Doação'}</div>
      <div class="photo-slot"></div>
      <h3>${item.name}</h3>
      <div class="cat">${CATEGORIES[item.category] || item.category}</div>
      <div class="desc-slot"></div>
      <div class="price ${item.type}">${item.type === 'venda' ? (item.price || 'A combinar') : 'Grátis'}</div>
      <a class="contact-btn" href="${waLink}" target="_blank" rel="noopener">Falar no WhatsApp</a>
    `;
    card.querySelector('.photo-slot').replaceWith(buildPhotoBlock(item));
    card.querySelector('.desc-slot').replaceWith(buildDescBlock(item));
    grid.appendChild(card);
  });
  renderPagination(totalPages);
}

function renderPagination(totalPages){
  const wrap = document.getElementById('pagination');
  wrap.innerHTML = '';
  if(totalPages <= 1) return;
  const prev = document.createElement('button');
  prev.className = 'page-btn';
  prev.textContent = '‹';
  prev.disabled = currentPage === 1;
  prev.onclick = ()=>{ currentPage--; render(); window.scrollTo({top:0, behavior:'smooth'}); };
  wrap.appendChild(prev);
  for(let p=1; p<=totalPages; p++){
    const b = document.createElement('button');
    b.className = 'page-btn' + (p === currentPage ? ' active' : '');
    b.textContent = p;
    b.onclick = ()=>{ currentPage = p; render(); window.scrollTo({top:0, behavior:'smooth'}); };
    wrap.appendChild(b);
  }
  const next = document.createElement('button');
  next.className = 'page-btn';
  next.textContent = '›';
  next.disabled = currentPage === totalPages;
  next.onclick = ()=>{ currentPage++; render(); window.scrollTo({top:0, behavior:'smooth'}); };
  wrap.appendChild(next);
}

buildFilters();
render();
</script>
</body>
</html>
