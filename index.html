<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tudo tem que sair — catálogo de mudança</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#a98f63;
    --board-dark:#8f7650;
    --paper:#f1e8d4;
    --paper-shadow:#d8c9a4;
    --ink:#2b241c;
    --ink-soft:#5a5040;
    --string:#a9855b;
    --sale:#b1372c;
    --donate:#3f5d3a;
    --pin:#c9401f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.05), transparent 40%),
      radial-gradient(circle at 80% 60%, rgba(0,0,0,0.08), transparent 45%),
      repeating-linear-gradient(0deg, var(--board) 0px, var(--board) 2px, var(--board-dark) 2px, var(--board-dark) 3px),
      var(--board);
    min-height:100vh;
  }

  /* ---------- header ---------- */
  header{
    padding:56px 24px 40px;
    text-align:center;
  }
  .stamp{
    display:inline-block;
    border:3px solid var(--paper);
    color:var(--paper);
    font-family:'Special Elite', monospace;
    font-size:clamp(28px, 5vw, 46px);
    letter-spacing:2px;
    padding:14px 28px;
    transform:rotate(-2deg);
    text-transform:uppercase;
    position:relative;
  }
  .stamp::before, .stamp::after{
    content:"";
    position:absolute;
    width:8px;height:8px;
    border:2px solid var(--paper);
    border-radius:50%;
    top:-5px;
  }
  .stamp::before{left:-5px;}
  .stamp::after{right:-5px;}
  header p{
    margin-top:18px;
    font-family:'Space Mono', monospace;
    color:var(--paper);
    opacity:0.85;
    font-size:14px;
    letter-spacing:1px;
  }

  /* ---------- filters ---------- */
  .filters{
    max-width:920px;
    margin:0 auto 8px;
    padding:0 24px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
  }
  .filter-btn{
    font-family:'Space Mono', monospace;
    font-size:12px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    background:var(--paper);
    color:var(--ink);
    border:1px dashed var(--ink-soft);
    padding:8px 14px;
    cursor:pointer;
    box-shadow:2px 2px 0 rgba(0,0,0,0.2);
    transition:transform 0.15s ease;
  }
  .filter-btn:hover{transform:translateY(-2px);}
  .filter-btn.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--paper);
  }

  .divider{
    max-width:920px;
    margin:24px auto;
    border:none;
    border-top:2px dashed rgba(241,232,212,0.4);
  }

  /* ---------- grid ---------- */
  #grid{
    max-width:1040px;
    margin:0 auto;
    padding:20px 32px 80px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:46px 28px;
  }

  .tag{
    position:relative;
    background:var(--paper);
    box-shadow:3px 4px 0 rgba(0,0,0,0.25);
    padding:18px 16px 16px;
    transition:transform 0.2s ease;
  }
  .tag:hover{transform:translateY(-4px) rotate(0deg) !important;}

  .pin{
    position:absolute;
    top:-11px;
    left:50%;
    transform:translateX(-50%);
    width:16px;height:16px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ff8a5c, var(--pin));
    box-shadow:0 2px 3px rgba(0,0,0,0.4);
    z-index:2;
  }
  .hole{
    position:absolute;
    top:10px; left:10px;
    width:12px;height:12px;
    border-radius:50%;
    background:var(--board);
    box-shadow:inset 0 0 0 1.5px rgba(0,0,0,0.3);
  }

  .type-stamp{
    position:absolute;
    top:12px; right:10px;
    font-family:'Special Elite', monospace;
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    padding:3px 8px;
    border:2px solid;
    transform:rotate(6deg);
    border-radius:3px;
  }
  .type-stamp.venda{color:var(--sale); border-color:var(--sale);}
  .type-stamp.doacao{color:var(--donate); border-color:var(--donate);}

  .photo{
    width:100%;
    aspect-ratio:4/3;
    background:repeating-linear-gradient(135deg, var(--paper-shadow), var(--paper-shadow) 8px, var(--paper) 8px, var(--paper) 16px);
    border:1.5px dashed var(--ink-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:14px;
    overflow:hidden;
  }
  .photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo svg{width:46%;opacity:0.55;}

  .tag h3{
    font-family:'Special Elite', monospace;
    font-size:16px;
    margin:14px 0 4px;
  }
  .tag .cat{
    font-family:'Space Mono', monospace;
    font-size:10px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:1px;
    margin-bottom:8px;
  }
  .tag .desc{
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.4;
    margin-bottom:12px;
    min-height:18px;
  }
  .price{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:15px;
    margin-bottom:12px;
  }
  .price.doacao{color:var(--donate);}
  .price.venda{color:var(--sale);}

  .contact-btn{
    display:block;
    text-align:center;
    text-decoration:none;
    font-family:'Space Mono', monospace;
    font-size:12px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    background:var(--ink);
    color:var(--paper);
    padding:10px;
    border:none;
    cursor:pointer;
  }
  .contact-btn:hover{background:#000;}

  .empty{
    grid-column:1/-1;
    text-align:center;
    color:var(--paper);
    font-family:'Space Mono', monospace;
    padding:60px 0;
    opacity:0.8;
  }

  footer{
    text-align:center;
    padding:20px;
    font-family:'Space Mono', monospace;
    font-size:11px;
    color:var(--paper);
    opacity:0.6;
  }

  @media (prefers-reduced-motion: reduce){
    .tag, .filter-btn{transition:none;}
  }
</style>
</head>
<body>

<header>
  <div class="stamp">Tudo tem que sair</div>
  <p>BRASIL &rarr; ITÁLIA · ITENS À VENDA E DOAÇÃO</p>
</header>

<div class="filters" id="typeFilters"></div>
<hr class="divider">
<div class="filters" id="catFilters"></div>

<div id="grid"></div>

<footer>catálogo pessoal · fale por WhatsApp em cada item</footer>

<script>
/* ======= CONFIGURE AQUI ======= */
const WHATSAPP_NUMBER = "5500000000000"; // troque pelo seu número, formato 55DDDNUMERO

const ICONS = {
  moveis: `<svg viewBox="0 0 64 64" fill="none" stroke="#2b241c" stroke-width="2.5"><rect x="8" y="26" width="48" height="18" rx="2"/><path d="M10 44v8M54 44v8"/><path d="M8 26v-6a6 6 0 0 1 6-6h36a6 6 0 0 1 6 6v6"/></svg>`,
  eletro: `<svg viewBox="0 0 64 64" fill="none" stroke="#2b241c" stroke-width="2.5"><rect x="14" y="8" width="36" height="48" rx="3"/><circle cx="32" cy="34" r="10"/><path d="M20 16h6"/></svg>`,
  cozinha: `<svg viewBox="0 0 64 64" fill="none" stroke="#2b241c" stroke-width="2.5"><path d="M18 8v20a10 10 0 0 0 10 10v18M18 8v14M26 8v14"/><path d="M46 8c-6 4-6 12-2 16l2 2v30"/></svg>`,
  decoracao: `<svg viewBox="0 0 64 64" fill="none" stroke="#2b241c" stroke-width="2.5"><rect x="10" y="10" width="44" height="34" rx="2"/><path d="M10 34l12-12 10 10 10-14 12 16"/><circle cx="20" cy="20" r="3"/></svg>`,
  outros: `<svg viewBox="0 0 64 64" fill="none" stroke="#2b241c" stroke-width="2.5"><path d="M32 8l24 12v24L32 56 8 44V20z"/><path d="M8 20l24 12 24-12M32 32v24"/></svg>`
};

const CATEGORIES = {
  moveis:   "Móveis",
  eletro:   "Eletrônicos",
  cozinha:  "Cozinha",
  decoracao:"Decoração",
  outros:   "Outros"
};

/* Adicione, edite ou remova itens aqui.
   photo: deixe "" para usar o ícone da categoria, ou coloque o caminho
   de um arquivo de foto (ex: "fotos/sofa.jpg") na mesma pasta do site. */
const ITEMS = [
  { name:"Sofá 3 lugares", category:"moveis",   type:"venda",  price:"R$ 450", desc:"Bom estado, tecido cinza.", photo:"" },
  { name:"Liquidificador", category:"eletro",   type:"venda",  price:"R$ 90",  desc:"Usado poucas vezes.", photo:"" },
  { name:"Estante de livros", category:"moveis", type:"doacao", price:"", desc:"Madeira maciça, 5 prateleiras.", photo:"" },
  { name:"Jogo de panelas", category:"cozinha",  type:"venda",  price:"R$ 120", desc:"Conjunto com 4 peças.", photo:"" },
  { name:"Quadros decorativos", category:"decoracao", type:"doacao", price:"", desc:"Kit com 3 quadros.", photo:"" },
  { name:"Caixa de ferramentas", category:"outros", type:"venda", price:"R$ 60", desc:"Completa, com maleta.", photo:"" },
];
/* ================================ */

let activeType = "todos";
let activeCat = "todos";

function buildFilters(){
  const typeWrap = document.getElementById('typeFilters');
  const typeOptions = [["todos","Todos"],["venda","Venda"],["doacao","Doação"]];
  typeOptions.forEach(([val,label])=>{
    const b = document.createElement('button');
    b.className = 'filter-btn' + (val==='todos' ? ' active' : '');
    b.textContent = label;
    b.dataset.val = val;
    b.onclick = ()=>{ activeType = val; refreshActive(typeWrap,b); render(); };
    typeWrap.appendChild(b);
  });

  const catWrap = document.getElementById('catFilters');
  const allBtn = document.createElement('button');
  allBtn.className = 'filter-btn active';
  allBtn.textContent = 'Todas categorias';
  allBtn.dataset.val = 'todos';
  allBtn.onclick = ()=>{ activeCat='todos'; refreshActive(catWrap, allBtn); render(); };
  catWrap.appendChild(allBtn);

  Object.entries(CATEGORIES).forEach(([key,label])=>{
    const b = document.createElement('button');
    b.className = 'filter-btn';
    b.textContent = label;
    b.dataset.val = key;
    b.onclick = ()=>{ activeCat = key; refreshActive(catWrap,b); render(); };
    catWrap.appendChild(b);
  });
}
function refreshActive(wrap, btn){
  [...wrap.children].forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
}

function render(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const filtered = ITEMS.filter(i =>
    (activeType === 'todos' || i.type === activeType) &&
    (activeCat === 'todos' || i.category === activeCat)
  );

  if(filtered.length === 0){
    grid.innerHTML = '<div class="empty">Nenhum item nessa combinação de filtros ainda.</div>';
    return;
  }

  filtered.forEach((item, idx) => {
    const rotation = (idx % 2 === 0 ? -1 : 1) * (1 + (idx % 3));
    const card = document.createElement('div');
    card.className = 'tag';
    card.style.transform = `rotate(${rotation}deg)`;

    const msg = encodeURIComponent(`Oi! Vi seu anúncio e tenho interesse em: ${item.name}`);
    const waLink = `https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`;

    card.innerHTML = `
      <div class="pin"></div>
      <div class="hole"></div>
      <div class="type-stamp ${item.type}">${item.type === 'venda' ? 'Venda' : 'Doação'}</div>
      <div class="photo">
        ${item.photo ? `<img src="${item.photo}" alt="${item.name}">` : ICONS[item.category] || ICONS.outros}
      </div>
      <h3>${item.name}</h3>
      <div class="cat">${CATEGORIES[item.category] || item.category}</div>
      <div class="desc">${item.desc || ''}</div>
      <div class="price ${item.type}">${item.type === 'venda' ? (item.price || 'A combinar') : 'Grátis'}</div>
      <a class="contact-btn" href="${waLink}" target="_blank" rel="noopener">Falar no WhatsApp</a>
    `;
    grid.appendChild(card);
  });
}

buildFilters();
render();
</script>
</body>
</html>
